[package]
name = "vlexyna"
version = "2.1.0"
description = "Vlexyna Studio — free, unlimited, audio-reactive music video studio"
authors = ["Vlexyna"]
edition = "2021"
rust-version = "1.77.2"

# The `lib` target is required by Tauri 2 (and reused for mobile if that ever happens)
[lib]
name = "vlexyna_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
