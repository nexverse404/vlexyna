name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  web:
    name: Web build & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run test:boot
      - run: npm run test:render
      - name: Upload rendered frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: render-frames
          path: test/out/
          if-no-files-found: ignore

  rust:
    name: cargo fmt · clippy · check · test (latest stable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build frontend (tauri embeds dist/ at compile time)
        run: npm run build
      - name: Install Tauri system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Install latest stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # run each cargo gate; on failure, mirror the output into workflow
      # annotations (readable via the GitHub API without downloading logs)
      - name: cargo fmt
        run: |
          if ! out=$(cargo fmt --check 2>&1); then
            printf '%s\n' "$out" | head -50 | while IFS= read -r l; do
              printf '::error title=cargo fmt::%s\n' "$l"
            done
            exit 1
          fi
        working-directory: src-tauri
      - name: cargo clippy
        run: |
          if ! out=$(cargo clippy --all-targets -- -D warnings 2>&1); then
            printf '%s\n' "$out" | sed 's/\x1b\[[0-9;]*m//g' > /tmp/c.log
            grep -E '^(error|warning)' /tmp/c.log | head -10 > /tmp/ann.txt
            [ -s /tmp/ann.txt ] || tail -10 /tmp/c.log > /tmp/ann.txt
            while IFS= read -r l; do printf '::error title=cargo clippy::%s\n' "$l"; done < /tmp/ann.txt
            exit 1
          fi
        working-directory: src-tauri
      - name: cargo check
        run: cargo check --all-targets
        working-directory: src-tauri
      - name: cargo test
        run: |
          if ! out=$(cargo test 2>&1); then
            printf '%s\n' "$out" | sed 's/\x1b\[[0-9;]*m//g' > /tmp/t.log
            grep -E '^(error|failures|test .* FAILED)' /tmp/t.log | head -10 > /tmp/ann.txt
            [ -s /tmp/ann.txt ] || tail -10 /tmp/t.log > /tmp/ann.txt
            while IFS= read -r l; do printf '::error title=cargo test::%s\n' "$l"; done < /tmp/ann.txt
            exit 1
          fi
        working-directory: src-tauri
